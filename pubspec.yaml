name: isc_notes
description: "A new Flutter project."
publish_to: "none"
version: 0.1.0

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  drift: ^2.29.0
  drift_flutter: ^0.2.7
  provider: ^6.1.5+1
  flex_color_scheme: ^8.3.1
  local_auth: ^3.0.0
  flutter_quill: ^11.5.0
  intl: any
  shared_preferences: ^2.5.3
  permission_handler: ^12.0.1
  flutter_colorpicker: ^1.1.0
  path_provider: ^2.1.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  
  drift_dev: ^2.29.0
  build_runner: ^2.9.0
  rename_app: ^1.6.3
  change_app_package_name: ^1.5.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/
    - assets/fonts/
    - assets/images/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
